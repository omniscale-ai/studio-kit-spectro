# ── computational gates (not user-modifiable: trust depends on them) ──

[[resources]]
id = "graph_gate"
description = "Cross-artifact semantic gate (verdict-evidence, threshold-calibration, finding-support)"
source = "scripts/graph_gate.py"
default_path = "scripts/graph_gate.py"
type = "file"
user_modifiable = false

[[resources]]
id = "emit_artifacts"
description = "Turn a pipeline result table into FIT and VERDICT artifacts"
source = "scripts/emit_artifacts.py"
default_path = "scripts/emit_artifacts.py"
type = "file"
user_modifiable = false

# ── workflows ─────────────────────────────────────────────────────────
# NB `public = true` is a canonical-manifest field and is NOT valid in
# manifest.toml v1.0 (additionalProperties: false). It is set for these
# four wf_* resources in .cf-studio-kit.toml, which is what surfaces them
# as cf-* skills.

[[resources]]
id = "wf_plan_analysis"
description = "Workflow: intake brainstorm producing an ANALYSIS-PLAN (gates all other workflows)"
source = "workflows/plan-analysis.md"
default_path = "workflows/plan-analysis.md"
type = "file"
user_modifiable = true

[[resources]]
id = "wf_analyse_spectra"
description = "Workflow: screen, fit and judge a spectrum series, emitting FIT and VERDICT artifacts"
source = "workflows/analyse-spectra.md"
default_path = "workflows/analyse-spectra.md"
type = "file"
user_modifiable = true

[[resources]]
id = "wf_calibrate_threshold"
description = "Workflow: license a threshold or constant against ground truth, producing a CALIBRATION"
source = "workflows/calibrate-threshold.md"
default_path = "workflows/calibrate-threshold.md"
type = "file"
user_modifiable = true

[[resources]]
id = "wf_audit_conclusions"
description = "Workflow: test a physical claim against what the data licenses, before it is published"
source = "workflows/audit-conclusions.md"
default_path = "workflows/audit-conclusions.md"
type = "file"
user_modifiable = true
