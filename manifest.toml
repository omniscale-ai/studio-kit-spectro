# Constructor Studio Spectro Kit — Declarative Installation Manifest
# Schema: kit-manifest.schema.json v1.0

[manifest]
version = "1.0"
root = "{cf-studio-path}/config/kits/{slug}"
user_modifiable = true

# ── DATASET ───────────────────────────────────────────────────────────

[[resources]]
id = "dataset_template"
description = "DATASET artifact template"
source = "artifacts/DATASET/template.md"
default_path = "artifacts/DATASET/template.md"
type = "file"
user_modifiable = true

[[resources]]
