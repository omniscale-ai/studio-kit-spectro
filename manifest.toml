default_path = "artifacts/DATASET/checklist.md"
type = "file"
user_modifiable = true

[[resources]]
id = "dataset_example_750pass"
description = "DATASET example (ZnO 750-pass set: synthesis axes, missing geometry)"
source = "artifacts/DATASET/examples/example-zno-750pass.md"
default_path = "artifacts/DATASET/examples/example-zno-750pass.md"
type = "file"
user_modifiable = true

[[resources]]
