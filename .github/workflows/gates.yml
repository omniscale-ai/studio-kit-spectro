name: gates
on: [push, pull_request]
jobs:
  graph-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross-artifact semantic gate
        run: python3 scripts/graph_gate.py artifacts
  gate-negative-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate must FAIL on a calibration with no false-positive rate
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("artifacts/CALIBRATION/examples/example-weight-floor.md")
          s = p.read_text()
          s = re.sub(r"## Error Rates\n.*?(?=\n## Attestation)",
                     "## Error Rates\n\nThe rule detects the problem reliably.\n",
                     s, flags=re.S)
          p.write_text(s)
          PY
          if python3 scripts/graph_gate.py artifacts; then
            echo "gate did not fail on a broken calibration"; exit 1
          fi
          git checkout -- artifacts
      - name: Gate must FAIL on a finding resting on refused verdicts
        run: |
          sed -i 's/^status: retracted/status: supported/' \
            artifacts/FINDING/examples/example-activation-energy.md
          if python3 scripts/graph_gate.py artifacts; then
            echo "gate did not fail on an unsupported finding"; exit 1
          fi
          git checkout -- artifacts
  claims-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Numbers quoted in examples must match their provenance
        run: python3 scripts/check_claims.py
      - name: The check must FAIL on a drifted number
        run: |
          sed -i 's/| misfit | 6\.6% over/| misfit | 9.9% over/' \
            artifacts/VERDICT/examples/example-zno-200c5-dark.md
          grep -q '9.9% over' artifacts/VERDICT/examples/example-zno-200c5-dark.md \
            || { echo "negative test edited nothing — it proves nothing"; exit 1; }
          if python3 scripts/check_claims.py; then
            echo "claims check did not notice a drifted number"; exit 1
          fi
          git checkout -- artifacts

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Full chain, asserting the documented outcome
        run: tests/run_end_to_end.sh

  verdict-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A verdict must mean the same thing to the emitter and to the gate.
      # Regression home for the G4 bypass: the two scripts composed the same
      # regexes in opposite orders, so "not usable for R_gb" read as permitting
      # and a finding built on refusals passed.
      - name: Verdict routing is consistent from table to gate
        run: python3 tests/test_routing.py

  noise-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Synthetic data with known truth: noisy -> imprecise, wrong model ->
      # biased, unidentifiable -> refused even when the fit is excellent.
      # The real dataset cannot test this; it carries no labels.
      - name: Noise, bias and identifiability are told apart
        run: python3 tests/test_noise.py

  completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One fit commonly yields several parameters, and FIT/VERDICT pair
      # one-to-one, so each needs its own emit. The ledger used to keep only
      # the last, and G8 was asking a complete question of an incomplete record.
      - name: The ledger records every emit from a DATASET
        run: python3 tests/test_completeness.py

  axis-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The kit's flagship failure: a rate law fitted along an axis where every
      # value is a different sample. G5 made the DATASET declare the kind;
      # nothing made a FINDING respect it until G9.
      - name: No supported trend along a synthesis axis
        run: python3 tests/test_axis_kind.py

  domain-adaptation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The kit pointed at a system it was not written for. A verdict
      # criterion declared in the plan is required of every permitting
      # verdict; a calibration from another system cannot be cited; a
      # borrowed one licenses verdicts but no supported finding; a DATASET
      # states its acquisition order; the emitter assumes no model.
      - name: Declared criteria, calibration scope, acquisition order
        run: python3 tests/test_domain.py
